<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <!-- Vân giấy dó truyền thống & họa tiết mây đồng tâm chìm -->
    <pattern id="vietPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Nền giấy ngà ấm -->
      <rect width="80" height="80" fill="#FAF6EE" />
      
      <!-- Họa tiết răng cưa & chấm hồi văn Đông Sơn chìm siêu mờ (2.5% opacity) -->
      <g stroke="#966C3E" stroke-width="0.75" fill="none" opacity="0.045">
        <circle cx="40" cy="40" r="32" stroke-dasharray="3 3" />
        <circle cx="40" cy="40" r="24" />
        <circle cx="40" cy="40" r="16" stroke-dasharray="2 2" />
        <!-- 8 tia sao mờ -->
        <line x1="40" y1="28" x2="40" y2="24" />
        <line x1="40" y1="52" x2="40" y2="56" />
        <line x1="28" y1="40" x2="24" y2="40" />
        <line x1="52" y1="40" x2="56" y2="40" />
        <line x1="31.5" y1="31.5" x2="28.5" y2="28.5" />
        <line x1="48.5" y1="48.5" x2="51.5" y2="51.5" />
        <line x1="48.5" y1="31.5" x2="51.5" y2="28.5" />
        <line x1="31.5" y1="48.5" x2="28.5" y2="51.5" />

        <!-- 4 góc kết nối hoa văn cổ -->
        <circle cx="0" cy="0" r="12" />
        <circle cx="80" cy="0" r="12" />
        <circle cx="0" cy="80" r="12" />
        <circle cx="80" cy="80" r="12" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#vietPattern)" />
</svg>

