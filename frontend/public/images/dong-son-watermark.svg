<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" opacity="0.85">
  <defs>
    <!-- Màu mực đồng cổ ấm -->
    <radialGradient id="fadeGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8C6239" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#8C6239" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#8C6239" stop-opacity="0" />
    </radialGradient>

    <!-- Họa tiết mây cổ truyền (Cloud motif) -->
    <g id="cloudMotif" stroke="#8C6239" stroke-width="1.8" fill="none" opacity="0.6">
      <path d="M0,20 C15,5 35,5 50,18 C65,10 90,12 100,28 C115,26 135,38 130,55 C125,70 105,75 85,72 C70,78 45,75 35,62 C20,68 5,55 8,40 C2,35 0,28 0,20 Z" />
      <path d="M25,25 C35,16 50,20 58,30 C65,22 80,24 88,34" />
      <path d="M35,60 C50,65 70,62 78,50" />
      <path d="M85,55 C95,50 110,54 112,62" />
    </g>

    <!-- Nhánh trúc / tre cổ điển (Bamboo motif) -->
    <g id="bambooBranch" fill="#7A6040" opacity="0.25">
      <!-- Cành chính -->
      <path d="M0,0 Q60,30 140,40 Q220,50 300,45" stroke="#7A6040" stroke-width="2.5" fill="none" />
      <!-- Lá trúc -->
      <path d="M40,22 Q70,10 110,5 Q75,25 40,22 Z" />
      <path d="M55,27 Q95,30 135,22 Q95,42 55,27 Z" />
      <path d="M100,34 Q140,25 185,15 Q150,40 100,34 Z" />
      <path d="M120,38 Q165,48 215,40 Q170,60 120,38 Z" />
      <path d="M170,44 Q220,35 270,22 Q230,52 170,44 Z" />
      <path d="M210,48 Q260,58 310,52 Q265,72 210,48 Z" />
      <path d="M260,46 Q310,40 360,30 Q320,60 260,46 Z" />
    </g>
  </defs>

  <!-- Nền tỏa ánh đồng cổ -->
  <rect width="100%" height="100%" fill="url(#fadeGlow)" />

  <!-- TRỐNG ĐỒNG ĐÔNG SƠN (TRUNG TÂM / PHÍA TRÊN) -->
  <g transform="translate(600, 200)" stroke="#8C6239" stroke-width="1.3" fill="none" opacity="0.14">
    <!-- Vòng ngoài cùng 1 - Họa tiết răng cưa -->
    <circle r="360" stroke-width="2.5" />
    <circle r="350" stroke-width="1" stroke-dasharray="4 4" />
    <circle r="340" stroke-width="2" />

    <!-- Vòng chim Lạc bay ngược chiều kim đồng hồ -->
    <circle r="325" stroke-width="1.2" />
    <g id="lacBirds">
      <!-- 8 chim Lạc đại diện bay trên vòng tròn trống đồng -->
      <g transform="rotate(0) translate(0, -305)">
        <path d="M-25,5 Q0,-8 35,-4 Q15,4 -5,8 Q-18,16 -35,18 Q-28,10 -25,5 Z" fill="#8C6239" stroke="none" />
        <!-- Cánh & Mỏ chim Lạc -->
        <path d="M-10,-2 Q-5,-25 15,-30 Q5,-15 5,-4" fill="#8C6239" stroke="none" />
        <path d="M35,-4 L48,-6 L38,0 Z" fill="#8C6239" stroke="none" />
      </g>
      <g transform="rotate(45) translate(0, -305)">
        <path d="M-25,5 Q0,-8 35,-4 Q15,4 -5,8 Q-18,16 -35,18 Q-28,10 -25,5 Z" fill="#8C6239" stroke="none" />
        <path d="M-10,-2 Q-5,-25 15,-30 Q5,-15 5,-4" fill="#8C6239" stroke="none" />
        <path d="M35,-4 L48,-6 L38,0 Z" fill="#8C6239" stroke="none" />
      </g>
      <g transform="rotate(90) translate(0, -305)">
        <path d="M-25,5 Q0,-8 35,-4 Q15,4 -5,8 Q-18,16 -35,18 Q-28,10 -25,5 Z" fill="#8C6239" stroke="none" />
        <path d="M-10,-2 Q-5,-25 15,-30 Q5,-15 5,-4" fill="#8C6239" stroke="none" />
        <path d="M35,-4 L48,-6 L38,0 Z" fill="#8C6239" stroke="none" />
      </g>
      <g transform="rotate(135) translate(0, -305)">
        <path d="M-25,5 Q0,-8 35,-4 Q15,4 -5,8 Q-18,16 -35,18 Q-28,10 -25,5 Z" fill="#8C6239" stroke="none" />
        <path d="M-10,-2 Q-5,-25 15,-30 Q5,-15 5,-4" fill="#8C6239" stroke="none" />
        <path d="M35,-4 L48,-6 L38,0 Z" fill="#8C6239" stroke="none" />
      </g>
      <g transform="rotate(180) translate(0, -305)">
        <path d="M-25,5 Q0,-8 35,-4 Q15,4 -5,8 Q-18,16 -35,18 Q-28,10 -25,5 Z" fill="#8C6239" stroke="none" />
        <path d="M-10,-2 Q-5,-25 15,-30 Q5,-15 5,-4" fill="#8C6239" stroke="none" />
        <path d="M35,-4 L48,-6 L38,0 Z" fill="#8C6239" stroke="none" />
      </g>
      <g transform="rotate(225) translate(0, -305)">
        <path d="M-25,5 Q0,-8 35,-4 Q15,4 -5,8 Q-18,16 -35,18 Q-28,10 -25,5 Z" fill="#8C6239" stroke="none" />
        <path d="M-10,-2 Q-5,-25 15,-30 Q5,-15 5,-4" fill="#8C6239" stroke="none" />
        <path d="M35,-4 L48,-6 L38,0 Z" fill="#8C6239" stroke="none" />
      </g>
      <g transform="rotate(270) translate(0, -305)">
        <path d="M-25,5 Q0,-8 35,-4 Q15,4 -5,8 Q-18,16 -35,18 Q-28,10 -25,5 Z" fill="#8C6239" stroke="none" />
        <path d="M-10,-2 Q-5,-25 15,-30 Q5,-15 5,-4" fill="#8C6239" stroke="none" />
        <path d="M35,-4 L48,-6 L38,0 Z" fill="#8C6239" stroke="none" />
      </g>
      <g transform="rotate(315) translate(0, -305)">
        <path d="M-25,5 Q0,-8 35,-4 Q15,4 -5,8 Q-18,16 -35,18 Q-28,10 -25,5 Z" fill="#8C6239" stroke="none" />
        <path d="M-10,-2 Q-5,-25 15,-30 Q5,-15 5,-4" fill="#8C6239" stroke="none" />
        <path d="M35,-4 L48,-6 L38,0 Z" fill="#8C6239" stroke="none" />
      </g>
    </g>
    <circle r="285" stroke-width="1.2" />

    <!-- Vòng hồi văn / hoa văn vòng tròn đồng tâm kép -->
    <circle r="260" stroke-width="2" />
    <circle r="245" stroke-dasharray="6 4" stroke-width="1.5" />
    <circle r="230" stroke-width="1.8" />

    <!-- Vòng người giã gạo / múa lễ hội (cách điệu) -->
    <circle r="190" stroke-width="1.2" stroke-dasharray="8 6" />
    <circle r="175" stroke-width="1.5" />

    <!-- Vòng hoa văn chữ S và răng lược gãy khúc -->
    <circle r="140" stroke-width="1.5" />
    <circle r="125" stroke-dasharray="3 3" stroke-width="1" />
    <circle r="110" stroke-width="2" />

    <!-- Ngôi sao 14 cánh trung tâm (Mặt trời Đông Sơn) -->
    <g fill="#8C6239" stroke="none">
      <!-- 14 tia sáng mặt trời -->
      <polygon points="0,-105 8,-40 -8,-40" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(25.71)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(51.43)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(77.14)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(102.86)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(128.57)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(154.29)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(180)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(205.71)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(231.43)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(257.14)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(282.86)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(308.57)" />
      <polygon points="0,-105 8,-40 -8,-40" transform="rotate(334.29)" />
      <circle r="36" fill="#8C6239" />
      <circle r="22" fill="#FAF5EA" />
      <circle r="10" fill="#8C6239" />
    </g>
  </g>

  <!-- HỌA TIẾT CÀNH TRÚC GÓC TRÊN TRÁI VÀ PHẢI (như trong ảnh mẫu của người dùng) -->
  <g transform="translate(-20, -10) scale(1.15)">
    <use href="#bambooBranch" />
    <use href="#bambooBranch" transform="translate(30, 40) rotate(15) scale(0.85)" />
    <use href="#bambooBranch" transform="translate(10, 80) rotate(-10) scale(0.7)" />
  </g>
  <g transform="translate(1220, -10) scale(-1.15, 1.15)">
    <use href="#bambooBranch" />
    <use href="#bambooBranch" transform="translate(30, 40) rotate(15) scale(0.85)" />
  </g>

  <!-- VÂN MÂY CỔ TRUYỀN (Hai bên góc trái & phải như ảnh) -->
  <g transform="translate(20, 110)">
    <use href="#cloudMotif" transform="scale(0.9)" />
    <use href="#cloudMotif" transform="translate(30, 50) scale(0.65)" />
  </g>
  <g transform="translate(30, 420)">
    <use href="#cloudMotif" transform="scale(0.8) opacity(0.4)" />
  </g>
  <g transform="translate(1060, 140) scale(-1, 1)">
    <use href="#cloudMotif" transform="scale(0.85)" />
    <use href="#cloudMotif" transform="translate(40, 60) scale(0.6)" />
  </g>
  <g transform="translate(1120, 460) scale(-1, 1)">
    <use href="#cloudMotif" transform="scale(0.75)" />
  </g>

  <!-- Dải chỉ hồi văn cổ dọc mép trang (Border motifs) -->
  <g stroke="#8C6239" stroke-width="0.8" opacity="0.12" fill="none">
    <line x1="30" y1="40" x2="30" y2="760" stroke-dasharray="8 4 2 4" />
    <line x1="1170" y1="40" x2="1170" y2="760" stroke-dasharray="8 4 2 4" />
  </g>
</svg>

